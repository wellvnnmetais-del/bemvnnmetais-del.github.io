<title>Portal de Presentes | VNN Metais</title>
<style>
:root{--navy:#0b1536;--navy2:#142653;--blue:#2856a6;--red:#d83443;--ink:#172033;--muted:#687386;--line:#e5e9f1;--bg:#f5f7fb;--white:#fff;--gold:#e8bd67}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}
header{background:var(--navy);color:white;position:sticky;top:0;z-index:10;box-shadow:0 6px 24px #08112a22}
