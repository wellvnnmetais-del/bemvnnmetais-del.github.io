.hero{background:radial-gradient(circle at 85% 25%,#29477f 0,transparent 28%),linear-gradient(120deg,#0b1536,#132958);color:white;overflow:hidden}.hero-inner{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding:72px 0 76px}.eyebrow{color:#f0c979;text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:800}.hero h1{font-size:clamp(34px,5vw,56px);line-height:1.07;letter-spacing:-1.6px;margin:14px 0 18px;max-width:650px}.hero p{color:#d6def2;font-size:17px;max-width:590px;margin:0 0 28px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:13px 18px;font-weight:750;transition:.2s}.btn-primary{background:var(--red);color:white;box-shadow:0 8px 22px #d8344330}.btn-primary:hover{transform:translateY(-1px);background:#c52c3a}.btn-light{background:white;color:var(--navy)}.btn-outline{background:transparent;border:1px solid #d9e1f0;color:inherit}.hero-art{min-height:290px;display:grid;place-items:center;position:relative}.giftbox{width:210px;height:170px;position:relative;background:linear-gradient(135deg,#f9fbff,#d9e3f6);border-radius:10px 10px 18px 18px;box-shadow:0 28px 50px #0004;transform:rotate(-5deg)}.giftbox:before{content:"";position:absolute;top:-28px;left:-9px;width:228px;height:43px;border-radius:8px;background:linear-gradient(135deg,#fff,#cbd8ef)}.giftbox:after{content:"";position:absolute;left:88px;top:-28px;width:35px;height:198px;background:linear-gradient(90deg,#b62536,#ed5863,#b62536)}.bow{position:absolute;top:-63px;left:68px;width:70px;height:53px;border:13px solid var(--red);border-radius:50% 50% 10% 50%;transform:rotate(25deg);z-index:2}.bow:after{content:"";position:absolute;width:70px;height:53px;border:13px solid #f35a66;border-radius:50% 50% 50% 10%;left:17px;top:-12px;transform:rotate(55deg)}.spark{position:absolute;color:var(--gold);font-size:34px}.spark.one{top:30px;right:12%}.spark.two{bottom:25px;left:10%;font-size:25px}.hero-note{position:absolute;bottom:2px;right:0;background:#ffffff13;border:1px solid #ffffff28;padding:12px 16px;border-radius:14px;color:#e6edff;font-size:13px}
section{padding:60px 0}.section-head{text-align:center;max-width:680px;margin:0 auto 32px}.section-head h2{font-size:clamp(27px,3vw,36px);letter-spacing:-.8px;margin:8px 0}.section-head p{color:var(--muted);margin:0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.step,.panel,.feature{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 8px 28px #17294d08}.step-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#edf2ff;color:var(--blue);font-size:23px}.step h3{margin:16px 0 7px}.step p{color:var(--muted);margin:0;font-size:14px}
.form-section{background:#edf1f8}.form-grid{display:grid;grid-template-columns:.72fr 1.28fr;gap:28px;align-items:start}.aside-card{background:var(--navy);color:white;border-radius:20px;padding:28px;position:sticky;top:100px}.aside-card h3{font-size:24px;margin:10px 0}.aside-card p{color:#d3dcf1;font-size:14px}.aside-card ul{padding-left:18px;color:#e6ebf8;font-size:14px}.panel h3{margin:0 0 5px;font-size:23px}.muted{color:var(--muted);font-size:14px;margin:0 0 22px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:750;color:#303b50}.field input,.field textarea,.field select{width:100%;border:1px solid #d9dfeb;background:#fff;border-radius:10px;padding:12px 13px;outline:none;color:var(--ink)}.field input:focus,.field textarea:focus,.field select:focus{border-color:#5077c5;box-shadow:0 0 0 3px #5077c51a}.field textarea{min-height:94px;resize:vertical}.hint{font-size:12px;color:var(--muted)}.checkrow{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:var(--muted)}.checkrow input{margin-top:4px}.form-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}.notice{display:none;padding:13px 15px;border-radius:10px;margin-top:15px;font-size:14px}.notice.show{display:block}.notice.success{background:#e8f8ee;color:#176337}.notice.error{background:#fff0f0;color:#a51e2a}
.admin-section{display:none}.admin-section.visible{display:block}.admin-top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{background:white;border:1px solid var(--line);padding:18px;border-radius:15px}.stat span{font-size:13px;color:var(--muted)}.stat strong{display:block;font-size:29px;color:var(--navy);margin-top:3px}.admin-list{display:grid;gap:12px}.donation{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:15px}.donation h4{margin:0 0 4px;font-size:17px}.donation p{margin:3px 0;color:var(--muted);font-size:13px}.status{display:inline-flex;border-radius:30px;padding:4px 9px;font-size:11px;font-weight:800;background:#fff3d8;color:#805200}.status.approved{background:#e5f7eb;color:#176337}.status.rejected{background:#ffe8e8;color:#a51e2a}.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.btn-sm{border:0;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:750}.approve{background:#e5f7eb;color:#176337}.reject{background:#ffe8e8;color:#a51e2a}.neutral{background:#edf1f8;color:#24314a}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed #cbd3e2;border-radius:14px;background:#fff}
footer{background:#08112a;color:white;padding:28px 0}.footer-inner{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.footer-inner p{margin:0;color:#b9c5e0;font-size:12px}.modal-backdrop{display:none;position:fixed;inset:0;background:#06102bcc;z-index:30;align-items:center;justify-content:center;padding:18px}.modal-backdrop.open{display:flex}.modal{background:white;width:min(420px,100%);border-radius:18px;padding:26px}.modal h3{margin-top:0}.modal input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0 14px}.demo-warning{font-size:12px;color:#805200;background:#fff6df;border:1px solid #f1dca5;border-radius:10px;padding:11px 13px;margin-top:14px}
@media(max-width:760px){.nav{padding:12px 0;align-items:flex-start}.navlinks{gap:2px;flex-wrap:wrap;justify-content:flex-end}.navlinks button{font-size:12px;padding:8px}.hero-inner{grid-template-columns:1fr;padding:52px 0 60px;gap:18px}.hero-art{min-height:245px}.giftbox{transform:scale(.85) rotate(-5deg)}.hero-note{right:0;bottom:0}.steps,.form-grid{grid-template-columns:1fr}.aside-card{position:static}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.stats{grid-template-columns:1fr}.donation{grid-template-columns:1fr}.section{padding:44px 0}}

/* === Refinamento visual V2: azul-marinho, azul, vermelho e branco === */
:root{
  --navy:#09132f;--navy2:#132653;--blue:#2458b4;--red:#d92f43;
  --ink:#17223a;--muted:#68758c;--line:#e2e8f2;--bg:#f4f7fc;
  --white:#fff;--gold:#f0c66e;
}
body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);letter-spacing:.05px}
header{border-bottom:3px solid var(--red);box-shadow:0 8px 28px #08132f20}
.nav{min-height:82px}
.brand{gap:13px;letter-spacing:.55px}
.brandmark{width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,#fff 0%,#dfe8fb 100%);box-shadow:0 5px 16px #0002;position:relative}
.brandmark:after{content:"";position:absolute;bottom:-4px;left:10px;right:10px;height:3px;border-radius:3px;background:var(--red)}
.brand small{margin-top:3px;color:#c7d5f5;font-size:10px;letter-spacing:1.65px}
.navlinks button{font-weight:650;transition:background .2s,transform .2s}
.navlinks button:hover{transform:translateY(-1px)}
.navlinks button.active{background:#ffffff16;box-shadow:inset 0 -2px var(--red)}
.hero{background:
 radial-gradient(ellipse at 82% 15%,#31569a70 0,transparent 30%),
 radial-gradient(ellipse at 12% 100%,#d92f4317 0,transparent 32%),
 linear-gradient(118deg,#09132f 0%,#10234c 56%,#17336a 100%);position:relative}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--red) 0 18%,#fff 18% 19%,var(--blue) 19% 100%)}
.hero-inner{padding-top:82px;padding-bottom:86px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:#ffffff0d;border:1px solid #ffffff25;border-radius:100px;padding:7px 12px;font-size:10px;letter-spacing:1.8px}
.hero h1{font-weight:850;letter-spacing:-1.9px;text-wrap:balance}
.hero h1:after{content:"";display:block;width:74px;height:4px;border-radius:8px;background:var(--red);margin-top:22px}
.hero p{line-height:1.8;color:#dce5f8}
.btn{border-radius:12px;min-height:46px;transition:transform .18s,box-shadow .18s,background .18s}
.btn-primary{background:linear-gradient(135deg,#e23a4c,#c92338);box-shadow:0 10px 25px #d834433b}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 13px 28px #d8344347}
.btn-light{box-shadow:0 8px 22px #0002}
.hero-art{filter:drop-shadow(0 18px 25px #0001)}
.giftbox{box-shadow:0 32px 55px #0005}
.hero-note{backdrop-filter:blur(12px);box-shadow:0 12px 28px #0002}
section{padding:72px 0}
.section-head{margin-bottom:38px}
.section-head .eyebrow{background:#eaf0fc;border-color:#dce6fa;color:var(--blue)!important}
.section-head h2{font-weight:850;letter-spacing:-1px;color:var(--navy);margin-top:14px}
.section-head p{line-height:1.8}
.steps{gap:20px}
.step{padding:27px;border-radius:20px;box-shadow:0 10px 30px #15295308;transition:transform .22s,box-shadow .22s,border-color .22s;position:relative;overflow:hidden}
.step:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--red));opacity:.9}
.step:hover{transform:translateY(-4px);box-shadow:0 18px 38px #15295313;border-color:#cbd8ef}
.step-icon{background:linear-gradient(145deg,#edf3ff,#e4ebfa);border:1px solid #dce6fa;color:var(--blue);box-shadow:inset 0 1px #fff}
.step h3{color:var(--navy);font-size:18px}
.step p{line-height:1.75}
.form-section{background:linear-gradient(180deg,#eef2f9,#f7f9fd)}
.aside-card{background:radial-gradient(circle at 100% 0,#294987 0,transparent 36%),linear-gradient(145deg,#09132f,#142b5b);box-shadow:0 18px 40px #0b153622;overflow:hidden;position:relative}
.aside-card:after{content:"";position:absolute;right:-34px;bottom:-48px;width:150px;height:150px;border:22px solid #ffffff0b;border-radius:50%}
.aside-card h3{letter-spacing:-.5px;line-height:1.2}
.aside-card ul{line-height:1.9}
.panel{border-radius:20px;padding:30px;box-shadow:0 14px 38px #14274d0b}
.panel h3{color:var(--navy);letter-spacing:-.5px}
.field label{letter-spacing:.1px}
.field input,.field textarea,.field select{border-color:#d7dfec;border-radius:11px;transition:border-color .18s,box-shadow .18s;background:#fcfdff}
.field input:hover,.field textarea:hover,.field select:hover{border-color:#b9c8e2}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 4px #2458b414}
.field input[type=file]{padding:10px;background:#f7f9fd}
.checkrow{line-height:1.65}
.admin-section{background:linear-gradient(180deg,#f5f7fc,#edf2f9)}
.stat{border-radius:16px;box-shadow:0 8px 25px #14274d08;position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.stat:nth-child(2):before{background:var(--red)}
.stat:nth-child(3):before{background:#239b69}
.stat strong{letter-spacing:-1px}
.donation{border-radius:16px;box-shadow:0 8px 24px #14274d07;transition:box-shadow .2s,border-color .2s}
.donation:hover{box-shadow:0 13px 30px #14274d11;border-color:#cbd8eb}
.btn-sm{transition:filter .15s,transform .15s}
.btn-sm:hover{filter:brightness(.97);transform:translateY(-1px)}
footer{border-top:4px solid var(--red);background:linear-gradient(110deg,#071027,#0e1d40)}
.footer-inner{padding-top:4px;padding-bottom:4px}
.demo-warning{line-height:1.6}
.modal{box-shadow:0 24px 70px #0004}
@media(max-width:760px){
 .nav{min-height:auto;align-items:center}
 .brand{font-size:12px}
 .brandmark{width:40px;height:40px}
 .navlinks{max-width:58%}
 .hero-inner{padding-top:55px;padding-bottom:64px}
 .hero h1{letter-spacing:-1.1px}
 section{padding:52px 0}
 .panel{padding:22px}
 .step{padding:23px}
}


/* Logo oficial Grupo VNN Metais em destaque */
.main-brand{gap:16px;min-width:0}
.official-logo{display:block;width:clamp(180px,22vw,265px);height:auto;max-height:66px;object-fit:contain;background:#fff;border-radius:8px;padding:5px 8px;flex-shrink:0}
.portal-label{font-size:12px;line-height:1.4;font-weight:850;letter-spacing:1.2px;color:#fff;white-space:nowrap}
.portal-label small{display:block;margin-top:5px;font-size:10px;letter-spacing:1px;font-weight:500;color:#cbd7f1;text-transform:uppercase}
.footer-brand .official-logo{width:210px;max-height:58px}
.footer-brand .portal-label{color:#fff}
@media(max-width:760px){
 .main-brand{gap:9px;align-items:center}
 .main-brand .official-logo{width:clamp(125px,37vw,190px);max-height:54px;padding:4px}
 .main-brand .portal-label{font-size:9px;letter-spacing:.6px;white-space:normal;max-width:100px}
 .main-brand .portal-label small{font-size:8px;letter-spacing:.3px}
 .footer-brand .official-logo{width:170px}
}
@media(max-width:420px){
 .nav{gap:8px;flex-wrap:wrap}
 .main-brand{width:100%;justify-content:center}
 .navlinks{max-width:100%;width:100%;justify-content:center}
}


/* V3 - homepage premium presentation and transparent official logo */
.official-logo{background:transparent!important;border-radius:0!important;padding:0!important;max-height:78px!important;width:clamp(210px,25vw,310px)!important;filter:drop-shadow(0 4px 10px #0002)}
.main-brand{gap:18px!important}
.hero-inner{grid-template-columns:1.08fr .92fr!important;gap:48px!important;padding-top:88px!important;padding-bottom:92px!important}
.hero h1{max-width:650px!important;font-size:clamp(38px,5.2vw,62px)!important}
.hero p{font-size:18px!important;max-width:610px!important}
.hero .btn-primary{min-height:58px!important;padding:17px 25px!important;font-size:16px!important;border-radius:14px!important}
.hero-art{min-height:350px!important;border-radius:30px;background:radial-gradient(ellipse at center,#ffffff0d,transparent 66%)}
.hero-art:before{content:"";position:absolute;width:300px;height:300px;border:1px solid #ffffff18;border-radius:50%;box-shadow:0 0 0 32px #ffffff08,0 0 0 64px #ffffff05}
.giftbox{z-index:1}
.hero-note{z-index:2;bottom:8px!important}
.hero .eyebrow{margin-bottom:4px}
.hero h1 em{font-style:normal;color:#f0c66e}
.hero-cta-note{margin-top:14px;color:#c7d4f0;font-size:12px}
.section-head h2{font-size:clamp(30px,3.3vw,40px)!important}
@media(max-width:760px){
 .main-brand .official-logo{width:clamp(145px,42vw,220px)!important;max-height:55px!important}
 .hero-inner{grid-template-columns:1fr!important;padding-top:56px!important;padding-bottom:64px!important;gap:18px!important}
 .hero h1{font-size:clamp(36px,10vw,48px)!important}
 .hero p{font-size:16px!important}
 .hero-art{min-height:260px!important}
}


/* Catálogo de sugestões de presentes */
.gift-catalog{background:#fff}
.gift-filters{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:-8px 0 28px}
.gift-filter{border:1px solid #dce4f1;background:#fff;color:#394760;border-radius:999px;padding:9px 15px;font-size:13px;font-weight:750;transition:.18s}
.gift-filter:hover,.gift-filter.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.gift-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.gift-card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 9px 25px #14274d09;transition:transform .2s,box-shadow .2s,border-color .2s;display:flex;flex-direction:column;min-width:0}
.gift-card:hover{transform:translateY(-4px);box-shadow:0 17px 35px #14274d14;border-color:#cbd8eb}
.gift-card[hidden]{display:none}
.gift-visual{height:155px;display:grid;place-items:center;position:relative;overflow:hidden}
.gift-visual:before,.gift-visual:after{content:"";position:absolute;border:1px solid #ffffff70;border-radius:50%;width:155px;height:155px}
.gift-visual:after{width:210px;height:210px}
.gift-blue{background:radial-gradient(circle at 50% 40%,#fff 0,#e7efff 38%,#cbd9f7 100%)}
.gift-red{background:radial-gradient(circle at 50% 40%,#fff 0,#fff0f1 38%,#f5cbd0 100%)}
.gift-gold{background:radial-gradient(circle at 50% 40%,#fff 0,#fff7e6 38%,#f0dfb8 100%)}
.gift-emoji{font-size:68px;filter:drop-shadow(0 10px 8px #18284922);z-index:1;transform:translateY(3px)}
.gift-tag{position:absolute;left:12px;top:12px;background:#ffffffd9;color:#1a2a4b;border:1px solid #ffffffbd;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800;z-index:2}
.gift-info{padding:17px;display:flex;flex-direction:column;align-items:flex-start;flex:1}
.gift-info h3{margin:0 0 7px;color:var(--navy);font-size:17px;letter-spacing:-.25px}
.gift-info p{font-size:13px;line-height:1.65;color:var(--muted);margin:0 0 16px;flex:1}
.gift-choose{width:100%;font-size:12px;padding:11px 9px;min-height:42px;margin-top:auto}
.gift-custom-note{margin-top:25px;padding:20px 22px;display:flex;gap:14px;align-items:flex-start;border:1px solid #dce5f4;background:linear-gradient(100deg,#f5f8ff,#fff);border-radius:16px}
.gift-custom-note>span{font-size:26px}
.gift-custom-note strong{color:var(--navy)}
.gift-custom-note p{color:var(--muted);font-size:13px;margin:4px 0 12px}
.gift-custom-note .btn{min-height:39px;padding:9px 13px;font-size:12px}
.catalog-disclaimer{text-align:center;color:var(--muted);font-size:11px;line-height:1.6;margin:17px auto 0;max-width:780px}
@media(max-width:900px){.gift-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:460px){.gift-grid{gap:11px}.gift-visual{height:125px}.gift-emoji{font-size:54px}.gift-info{padding:13px}.gift-info h3{font-size:15px}.gift-info p{font-size:12px}.gift-choose{font-size:11px}.gift-filters{justify-content:flex-start}.gift-custom-note{padding:16px}}


/* Compra direta e preparação para gateway */
.gift-price{font-size:22px;font-weight:850;letter-spacing:-.5px;color:var(--navy);margin:0 0 13px}
.gift-choose{font-size:13px!important;font-weight:800!important}
.checkout-overlay{display:none;position:fixed;inset:0;z-index:9999;background:#071027b8;backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:20px}
.checkout-overlay.visible{display:flex}
.checkout-dialog{width:min(100%,460px);background:#fff;border-radius:24px;padding:32px;text-align:center;position:relative;box-shadow:0 30px 90px #0005;animation:checkoutPop .2s ease-out}
@keyframes checkoutPop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.checkout-close{position:absolute;right:14px;top:12px;border:0;background:#f0f3f9;border-radius:50%;width:36px;height:36px;font-size:25px;line-height:1;color:#23304a;cursor:pointer}
.checkout-icon{font-size:42px;margin-bottom:10px}
.checkout-dialog .eyebrow{color:#2458b4;justify-content:center}
.checkout-dialog h2{font-size:27px;line-height:1.15;color:var(--navy);margin:15px 0 8px}
.checkout-product{font-weight:750;color:#3a4964;margin:0}
.checkout-price{font-size:30px;font-weight:900;color:var(--navy);margin:12px 0}
.checkout-help{font-size:13px;line-height:1.7;color:var(--muted);background:#f4f7fc;border-radius:12px;padding:13px;margin:18px 0}
@media(max-width:460px){.checkout-dialog{padding:27px 20px}.checkout-dialog h2{font-size:24px}}

</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <div class="brand main-brand"><img class="official-logo" src="data:image/png;base64," alt="Grupo VNN Metais"><div class="portal-label">PORTAL DE PRESENTES<small>Relacionamento com fornecedores</small></div></div>
    <nav class="navlinks" aria-label="Navegação">
      <button class="active" data-view="home">Início</button>
      <button data-view="admin">Área administrativa</button>
    </nav>
  </div>
</header>
<main id="homeView">
  <div class="hero">
    <div class="wrap hero-inner">
      <div>
        <div class="eyebrow">Uma parceria que também presenteia</div>
        <h1>Presentear é fortalecer <em>parcerias.</em></h1>
        <p>Escolha um presente da nossa lista e siga para a compra. Os itens serão destinados aos sorteios especiais dos colaboradores da VNN Metais.</p>
        <button class="btn btn-primary" onclick="document.getElementById('giftCatalog').scrollIntoView({behavior:'smooth'})">🎁 Ver lista de presentes</button><div class="hero-cta-note">Escolha seu presente e continue para o pagamento</div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <span class="spark one">✦</span><span class="spark two">✧</span><div class="bow"></div><div class="giftbox"></div>
        <div class="hero-note">Gratidão por fazer parte da nossa história.</div>
      </div>
    </div>
  </div>
  <section>
    <div class="wrap">
      <div class="section-head"><div class="eyebrow" style="color:#2856a6">Como participar</div><h2>É simples fazer parte</h2><p>Escolha um item do catálogo e siga para o checkout para concluir a compra.</p></div>
      <div class="steps">
        <article class="step"><div class="step-icon">✍️</div><h3>1. Escolha um presente</h3><p>Veja as opções disponíveis e selecione o presente que deseja comprar.</p></article>
        <article class="step"><div class="step-icon">🤝</div><h3>2. Finalize a compra</h3><p>Você será direcionado ao gateway de pagamento assim que os links de checkout forem configurados.</p></article>
        <article class="step"><div class="step-icon">🎉</div><h3>3. Presente para o sorteio</h3><p>Após a confirmação da compra e do recebimento, o presente poderá entrar na lista de prêmios dos sorteios internos.</p></article>
      </div>
    </div>
  </section>

  <section class="gift-catalog" id="giftCatalog">
    <div class="wrap">
      <div class="section-head">
        <div class="eyebrow" style="color:#2856a6">Lista de presentes</div>
        <h2>Ideias para presentear nossos colaboradores</h2>
        <p>Escolha um presente e clique em “Comprar agora”. Os preços abaixo são exemplos editáveis antes da publicação.</p>
      </div>
      <div class="gift-filters" role="group" aria-label="Filtrar presentes">
        <button class="gift-filter active" data-gift-filter="todos">Todos</button>
        <button class="gift-filter" data-gift-filter="eletronicos">Eletrônicos</button>
        <button class="gift-filter" data-gift-filter="casa">Casa e cozinha</button>
        <button class="gift-filter" data-gift-filter="cestas">Cestas e gourmet</button>
        <button class="gift-filter" data-gift-filter="bem-estar">Bem-estar</button>
      </div>
      <div class="gift-grid" id="giftGrid">
        <article class="gift-card" data-category="eletronicos">
          <div class="gift-visual gift-blue"><span class="gift-emoji">🎧</span><span class="gift-tag">Eletrônicos</span></div>
          <div class="gift-info"><h3>Fone Bluetooth</h3><p>Um presente prático para música, chamadas e momentos de lazer.</p><div class="gift-price">R$ 129,90</div><button class="btn btn-primary gift-choose" data-gift="Fone Bluetooth" data-price="129.90">Comprar agora</button></div>
        </article>
        <article class="gift-card" data-category="eletronicos">
          <div class="gift-visual gift-red"><span class="gift-emoji">🔊</span><span class="gift-tag">Eletrônicos</span></div>
          <div class="gift-info"><h3>Caixa de som portátil</h3><p>Som para aproveitar encontros, passeios e momentos especiais.</p><div class="gift-price">R$ 199,90</div><button class="btn btn-primary gift-choose" data-gift="Caixa de som portátil" data-price="199.90">Comprar agora</button></div>
        </article>
        <article class="gift-card" data-category="casa">
          <div class="gift-visual gift-gold"><span class="gift-emoji">🍟</span><span class="gift-tag">Casa e cozinha</span></div>
          <div class="gift-info"><h3>Air fryer</h3><p>Uma opção útil para facilitar o preparo das refeições.</p><div class="gift-price">R$ 399,90</div><button class="btn btn-primary gift-choose" data-gift="Air fryer" data-price="399.90">Comprar agora</button></div>
        </article>
        <article class="gift-card" data-category="casa">
          <div class="gift-visual gift-blue"><span class="gift-emoji">☕</span><span class="gift-tag">Casa e cozinha</span></div>
          <div class="gift-info"><h3>Cafeteira</h3><p>Para deixar os momentos de café ainda mais gostosos.</p><div class="gift-price">R$ 249,90</div><button class="btn btn-primary gift-choose" data-gift="Cafeteira" data-price="249.90">Comprar agora</button></div>
        </article>
        <article class="gift-card" data-category="cestas">
          <div class="gift-visual gift-red"><span class="gift-emoji">🍫</span><span class="gift-tag">Cestas e gourmet</span></div>
          <div class="gift-info"><h3>Kit de chocolates</h3><p>Uma lembrança deliciosa para adoçar o dia de alguém.</p><div class="gift-price">R$ 79,90</div><button class="btn btn-primary gift-choose" data-gift="Kit de chocolates" data-price="79.90">Comprar agora</button></div>
        </article>
        <article class="gift-card" data-category="cestas">
          <div class="gift-visual gift-gold"><span class="gift-emoji">🧺</span><span class="gift-tag">Cestas e gourmet</span></div>
          <div class="gift-info"><h3>Cesta de café da manhã</h3><p>Uma cesta especial para celebrar e surpreender.</p><div class="gift-price">R$ 159,90</div><button class="btn btn-primary gift-choose" data-gift="Cesta de café da manhã" data-price="159.90">Comprar agora</button></div>
        </article>
        <article class="gift-card" data-category="bem-estar">
          <div class="gift-visual gift-blue"><span class="gift-emoji">🌸</span><span class="gift-tag">Bem-estar</span></div>
          <div class="gift-info"><h3>Kit de perfumes e cuidados</h3><p>Um conjunto para presentear com carinho e cuidado.</p><div class="gift-price">R$ 119,90</div><button class="btn btn-primary gift-choose" data-gift="Kit de perfumes e cuidados" data-price="119.90">Comprar agora</button></div>
        </article>
        <article class="gift-card" data-category="eletronicos">
          <div class="gift-visual gift-red"><span class="gift-emoji">⌚</span><span class="gift-tag">Eletrônicos</span></div>
          <div class="gift-info"><h3>Relógio inteligente</h3><p>Um acessório moderno para acompanhar a rotina.</p><div class="gift-price">R$ 299,90</div><button class="btn btn-primary gift-choose" data-gift="Relógio inteligente" data-price="299.90">Comprar agora</button></div>
        </article>
      </div>
      <div class="gift-custom-note"><span>🛍️</span><div><strong>Quer sugerir outro presente?</strong><p>Podemos adicionar novos produtos ao catálogo conforme você definir os itens e os preços.</p></div></div>
      <p class="catalog-disclaimer">Valores ilustrativos para configuração inicial. Atualize os preços e configure os links do gateway de pagamento antes de divulgar o site.</p>
    </div>
  </section>

</main>

<div id="checkoutNotice" class="checkout-overlay" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle" aria-hidden="true">
  <div class="checkout-dialog">
    <button class="checkout-close" aria-label="Fechar" onclick="closeCheckoutNotice()">×</button>
    <div class="checkout-icon">🛍️</div>
    <div class="eyebrow">Compra direta</div>
    <h2 id="checkoutTitle">Seu presente está selecionado</h2>
    <p class="checkout-product" id="checkoutProduct"></p>
    <div class="checkout-price" id="checkoutPrice"></div>
    <p class="checkout-help">O botão de compra está preparado. Para receber pagamentos, configure o link de checkout do seu gateway no código do site.</p>
    <button class="btn btn-primary" onclick="closeCheckoutNotice()">Voltar à lista</button>
  </div>
</div>
<section id="adminView" class="admin-section">
  <div class="wrap">
    <div class="section-head"><div class="eyebrow" style="color:#2856a6">Área restrita</div><h2>Painel administrativo</h2><p>Analise as propostas, aprove as doações confirmadas e organize os sorteios internos.</p></div>
    <div id="adminLocked" class="panel" style="max-width:500px;margin:auto">
      <h3>Acesso administrativo</h3><p class="muted">Digite a senha de demonstração para abrir o painel.</p>
      <form id="loginForm"><div class="field"><label for="adminPassword">Senha</label><input id="adminPassword" type="password" placeholder="Senha de demonstração" required></div><button class="btn btn-primary" style="margin-top:14px" type="submit">Entrar no painel</button></form>
      <div class="demo-warning">Demonstração: a senha inicial é <strong>VNN2026</strong>. Este bloqueio não substitui autenticação segura de um site publicado.</div>
      <div id="loginNotice" class="notice error"></div>
    </div>
    <div id="adminContent" style="display:none">
      <div class="admin-top"><div><h3 style="margin:0">Propostas recebidas</h3><p class="muted" style="margin:4px 0 0">Aprove apenas doações cuja entrega já tenha sido combinada.</p></div><div class="actions"><button class="btn btn-outline" style="color:var(--ink)" onclick="exportCSV()">Exportar CSV</button><button class="btn btn-outline" style="color:var(--ink)" onclick="logout()">Sair</button></div></div>
      <div class="stats"><div class="stat"><span>Total de propostas</span><strong id="statTotal">0</strong></div><div class="stat"><span>Aguardando análise</span><strong id="statPending">0</strong></div><div class="stat"><span>Doações aprovadas</span><strong id="statApproved">0</strong></div></div>
      <div class="admin-top"><div class="field" style="min-width:220px"><label for="filterStatus">Filtrar propostas</label><select id="filterStatus" onchange="renderDonations()"><option value="all">Todas</option><option value="pending">Aguardando análise</option><option value="approved">Aprovadas</option><option value="rejected">Recusadas</option></select></div><button class="btn btn-primary" onclick="openDraw()">🎉 Realizar sorteio</button></div>
      <div id="donationList" class="admin-list"></div>
      <div id="drawPanel" class="panel" style="display:none;margin-top:22px">
        <h3>🎉 Sorteio de demonstração</h3><p class="muted">Selecione os nomes dos funcionários participantes e um presente aprovado. O resultado fica registrado neste navegador.</p>
        <div class="fields">
          <div class="field"><label for="prizeSelect">Presente aprovado</label><select id="prizeSelect"></select></div>
          <div class="field"><label for="employeeNames">Funcionários participantes</label><textarea id="employeeNames" placeholder="Um nome por linha"></textarea></div>
        </div>
        <div class="form-actions"><button class="btn btn-primary" onclick="drawWinner()">Sortear ganhador</button><button class="btn btn-outline" style="color:var(--ink)" onclick="document.getElementById('drawPanel').style.display='none'">Fechar</button></div>
        <div id="drawResult" class="notice success"></div>
        <h4>Histórico de sorteios</h4><div id="drawHistory"></div>
      </div>
    </div>
  </div>
</section>
</main>
<footer><div class="wrap footer-inner"><div class="brand footer-brand"><img class="official-logo" src="data:image/png;base64," alt="Grupo VNN Metais"><div class="portal-label">PORTAL DE PRESENTES<small>VNN Metais</small></div></div><p>Portal interno para recebimento de propostas voluntárias de presentes.</p></div></footer>
<div class="modal-backdrop" id="detailModal"><div class="modal"><h3>Detalhes da proposta</h3><div id="detailBody"></div><button class="btn btn-outline" style="color:var(--ink);margin-top:15px" onclick="closeDetails()">Fechar</button></div></div>
<script>
const STORAGE_KEY='vnn_gift_portal_donations_v1', DRAW_KEY='vnn_gift_portal_draws_v1';
let adminLogged=false;
function getDonations(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return []}}
function saveDonations(items){localStorage.setItem(STORAGE_KEY,JSON.stringify(items))}
function getDraws(){try{return JSON.parse(localStorage.getItem(DRAW_KEY)||'[]')}catch(e){return []}}
function saveDraws(items){localStorage.setItem(DRAW_KEY,JSON.stringify(items))}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showView(view){
 document.getElementById('homeView').style.display=view==='home'?'block':'none';
 
 document.getElementById('adminView').classList.toggle('visible',view==='admin');
 document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
 if(view==='admin')renderDonations();
 window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));
document.getElementById('loginForm').addEventListener('submit',e=>{
 e.preventDefault();const n=document.getElementById('loginNotice');
 if(document.getElementById('adminPassword').value==='VNN2026'){adminLogged=true;document.getElementById('adminLocked').style.display='none';document.getElementById('adminContent').style.display='block';n.className='notice';renderDonations()}
 else{n.className='notice show error';n.textContent='Senha incorreta. Tente novamente.'}
});
function logout(){adminLogged=false;document.getElementById('adminLocked').style.display='block';document.getElementById('adminContent').style.display='none';document.getElementById('adminPassword').value=''}
function statusLabel(s){return s==='approved'?'Aprovada':s==='rejected'?'Recusada':'Aguardando análise'}
function renderDonations(){
 if(!adminLogged)return;
 const all=getDonations();document.getElementById('statTotal').textContent=all.length;document.getElementById('statPending').textContent=all.filter(x=>x.status==='pending').length;document.getElementById('statApproved').textContent=all.filter(x=>x.status==='approved').length;
 const filter=document.getElementById('filterStatus').value;const items=filter==='all'?all:all.filter(x=>x.status===filter);const list=document.getElementById('donationList');
 if(!items.length){list.innerHTML='<div class="empty">Nenhuma proposta encontrada. Quando um fornecedor enviar uma proposta neste navegador, ela aparecerá aqui.</div>'}
 else list.innerHTML=items.map(x=>`<article class="donation"><div><span class="status ${x.status}">${statusLabel(x.status)}</span><h4 style="margin-top:9px">${escapeHTML(x.gift)} <span style="color:#687386;font-size:13px">× ${x.quantity}</span></h4><p><strong>${escapeHTML(x.supplier)}</strong> · contato: ${escapeHTML(x.contact)}</p><p>${escapeHTML(x.email)} · ${escapeHTML(x.phone)}</p><p>Enviada em ${new Date(x.createdAt).toLocaleString('pt-BR')}</p><div class="actions" style="margin-top:10px"><button class="btn-sm neutral" onclick="showDetails('${x.id}')">Ver descrição</button>${x.status!=='approved'?`<button class="btn-sm approve" onclick="changeStatus('${x.id}','approved')">Aprovar</button>`:''}${x.status!=='rejected'?`<button class="btn-sm reject" onclick="changeStatus('${x.id}','rejected')">Recusar</button>`:''}<button class="btn-sm neutral" onclick="deleteDonation('${x.id}')">Excluir</button></div></div></article>`).join('');
 renderDrawOptions();
}
function changeStatus(id,status){const items=getDonations();const item=items.find(x=>x.id===id);if(item){item.status=status;saveDonations(items);renderDonations()}}
function deleteDonation(id){if(!confirm('Deseja excluir esta proposta deste navegador?'))return;saveDonations(getDonations().filter(x=>x.id!==id));renderDonations()}
function showDetails(id){const x=getDonations().find(x=>x.id===id);if(!x)return;document.getElementById('detailBody').innerHTML=`<p><strong>Presente:</strong> ${escapeHTML(x.gift)}</p><p><strong>Descrição:</strong> ${escapeHTML(x.description)}</p><p><strong>Quantidade:</strong> ${x.quantity}</p><p><strong>Entrega:</strong> ${escapeHTML(x.delivery||'Não informada')}</p><p><strong>Foto selecionada:</strong> ${escapeHTML(x.photoName||'Nenhuma')}</p>`;document.getElementById('detailModal').classList.add('open')}
function closeDetails(){document.getElementById('detailModal').classList.remove('open')}
function exportCSV(){const items=getDonations();if(!items.length){alert('Não há propostas para exportar.');return}const cols=['supplier','contact','email','phone','gift','quantity','description','delivery','status','createdAt'];const csv=[cols.join(';'),...items.map(x=>cols.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(';'))].join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='propostas-presentes-vnn.csv';a.click();URL.revokeObjectURL(a.href)}
function renderDrawOptions(){const sel=document.getElementById('prizeSelect');if(!sel)return;const approved=getDonations().filter(x=>x.status==='approved');sel.innerHTML=approved.length?approved.map(x=>`<option value="${x.id}">${escapeHTML(x.gift)} — ${escapeHTML(x.supplier)}</option>`).join(''):'<option value="">Nenhum presente aprovado</option>'}
function openDraw(){document.getElementById('drawPanel').style.display='block';renderDrawOptions();renderDrawHistory();document.getElementById('drawPanel').scrollIntoView({behavior:'smooth',block:'start'})}
function drawWinner(){const id=document.getElementById('prizeSelect').value;const prize=getDonations().find(x=>x.id===id&&x.status==='approved');const names=document.getElementById('employeeNames').value.split('\n').map(n=>n.trim()).filter(Boolean);const result=document.getElementById('drawResult');if(!prize){result.className='notice show error';result.textContent='Aprove primeiro uma doação para poder sortear.';return}if(!names.length){result.className='notice show error';result.textContent='Digite pelo menos um funcionário participante, um nome por linha.';return}const winner=names[Math.floor(Math.random()*names.length)];const draw={id:Date.now().toString(36),gift:prize.gift,supplier:prize.supplier,winner,createdAt:new Date().toISOString()};const draws=getDraws();draws.unshift(draw);saveDraws(draws);result.className='notice show success';result.innerHTML=`🏆 Ganhador: <strong>${escapeHTML(winner)}</strong> — presente: <strong>${escapeHTML(prize.gift)}</strong>.`;renderDrawHistory()}
function renderDrawHistory(){const el=document.getElementById('drawHistory');const draws=getDraws();el.innerHTML=draws.length?draws.map(d=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><strong>${escapeHTML(d.winner)}</strong> ganhou <strong>${escapeHTML(d.gift)}</strong><div class="hint">${escapeHTML(d.supplier)} · ${new Date(d.createdAt).toLocaleString('pt-BR')}</div></div>`).join(''):'<p class="muted">Ainda não há sorteios registrados.</p>'}

// Catálogo de presentes: filtros e preenchimento do formulário de doação
document.querySelectorAll('[data-gift-filter]').forEach(button=>{
  button.addEventListener('click',()=>{
    document.querySelectorAll('[data-gift-filter]').forEach(b=>b.classList.toggle('active',b===button));
    const category=button.dataset.giftFilter;
    document.querySelectorAll('.gift-card').forEach(card=>{
      card.hidden=category!=='todos' && card.dataset.category!==category;
    });
  });
});
// Configure aqui os links de checkout de cada produto quando o gateway estiver pronto.
const CHECKOUT_LINKS = {
  "Fone Bluetooth": "",
  "Caixa de som portátil": "",
  "Air fryer": "",
  "Cafeteira": "",
  "Kit de chocolates": "",
  "Cesta de café da manhã": "",
  "Kit de perfumes e cuidados": "",
  "Relógio inteligente": ""
};
document.querySelectorAll('.gift-choose').forEach(button=>{
  button.addEventListener('click',()=>{
    const giftName=button.dataset.gift;
    const price=Number(button.dataset.price || 0);
    const checkoutUrl=CHECKOUT_LINKS[giftName];
    if(checkoutUrl){
      window.location.href=checkoutUrl;
      return;
    }
    openCheckoutNotice(giftName,price);
  });
});
function openCheckoutNotice(giftName,price){
  const modal=document.getElementById('checkoutNotice');
  document.getElementById('checkoutProduct').textContent=giftName;
  document.getElementById('checkoutPrice').textContent=price.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  modal.classList.add('visible');
  modal.setAttribute('aria-hidden','false');
}
function closeCheckoutNotice(){
  const modal=document.getElementById('checkoutNotice');
  modal.classList.remove('visible');
  modal.setAttribute('aria-hidden','true');
}

</script>
</body>
</html>
